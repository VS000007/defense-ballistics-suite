<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting to Simulator...</title>
    <script>
      // Single Page App redirect for GitHub Pages
      var path = window.location.pathname;
      var repo = '/defense-ballistics-suite';
      if (path.indexOf('/simulator') !== -1) {
        window.location.replace(repo + '/#simulator');
      } else {
        window.location.replace(repo + '/');
      }
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
